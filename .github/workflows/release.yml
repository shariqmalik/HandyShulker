name: Release Paper plugins

on:
  push:
    tags: ['paper-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Check release tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#paper-v}"
          LEGACY_VERSION=$(grep "^version =" paper-plugin/build.gradle | head -1 | cut -d "'" -f2)
          MODERN_VERSION=$(grep "^version =" paper-plugin-26.3/build.gradle | head -1 | cut -d "'" -f2)
          if [ "$TAG_VERSION" != "$LEGACY_VERSION" ] || [ "$TAG_VERSION" != "$MODERN_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) must match both plugin versions ($LEGACY_VERSION and $MODERN_VERSION)."
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

          if [[ "$TAG_VERSION" =~ -(alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            if [[ "$TAG_VERSION" =~ -alpha ]]; then
              echo "MODRINTH_VERSION_TYPE=alpha" >> "$GITHUB_ENV"
            else
              echo "MODRINTH_VERSION_TYPE=beta" >> "$GITHUB_ENV"
            fi
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "MODRINTH_VERSION_TYPE=release" >> "$GITHUB_ENV"
          fi

      - name: Extract Paper changelog
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' paper-plugin/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No Paper changelog entry found for $VERSION."
            exit 1
          fi

      - name: Build legacy Paper plugin
        run: ./gradlew -p paper-plugin build

      - name: Build Paper 26.3 plugin
        run: ./gradlew -p paper-plugin-26.3 build

      - name: Stage release JARs
        run: |
          mkdir -p release-files
          cp paper-plugin/build/libs/handy-shulker-paper-*.jar release-files/HandyShulker-Paper-${GITHUB_REF_NAME}-legacy.jar
          cp paper-plugin-26.3/build/libs/handy-shulker-paper-*-26.3.jar release-files/HandyShulker-Paper-${GITHUB_REF_NAME}-26.3.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Handy Shulker Paper v${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: release-files/*.jar

      - name: Publish Paper 26.3 plugin to Modrinth
        if: vars.MODRINTH_PAPER_PROJECT_ID != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PAPER_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Set the MODRINTH_TOKEN repository secret to enable Modrinth publishing."
            exit 1
          fi

          FILE="release-files/HandyShulker-Paper-${GITHUB_REF_NAME}-26.3.jar"
          METADATA=$(jq -n --rawfile changelog release-notes.md \
            --arg project_id "$MODRINTH_PROJECT_ID" \
            --arg version "$VERSION" \
            --arg version_type "$MODRINTH_VERSION_TYPE" \
            '{name: ("Handy Shulker Paper 26.3 " + $version),
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: ["26.3"],
              version_type: $version_type,
              loaders: ["paper"],
              featured: false,
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file",
              environment: "server_only"}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --form "data=$METADATA;type=application/json" \
            --form "file=@$FILE;type=application/java-archive" \
            https://api.modrinth.com/v2/version
